[package]
name = "bolt-load-utils"
description = "Utility functions for bolt-load: async readers and tracing helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
tracing = ["dep:tracing"]
reader = ["dep:blocking", "dep:futures", "dep:bytes"]

[dependencies]
tracing = { workspace = true, optional = true }

# Reader
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
blocking = { workspace = true, optional = true }

[dev-dependencies]
n0-tracing-test = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true, features = ["full"] }
