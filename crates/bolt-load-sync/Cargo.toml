[package]
name = "bolt-load-sync"
description = "Runtime-agnostic synchronization primitives for bolt-load: latest-value watch channel and slot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `WatchStream`, a `futures_core::Stream` over a watch receiver.
stream = ["dep:futures-core"]

[dependencies]
event-listener = "5"
futures-core = { version = "0.3", optional = true }

[dev-dependencies]
futures = { workspace = true }
bolt-load-sync = { path = ".", features = ["stream"] }
pretty_assertions = { workspace = true }

# Model checking: `RUSTFLAGS="--cfg loom" cargo test -p bolt-load-sync --release --test loom`
[target.'cfg(loom)'.dependencies]
loom = "0.7"
event-listener = { version = "5", features = ["loom"] }

[target.'cfg(loom)'.dev-dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
