[package]
name = "bolt-load"
edition = "2024"
version = "0.1.0"
rust-version = "1.85.0" # the first version that supports 2024 edition

[features]
default = ["reqwest", "tokio", "serde", "tracing"]
http = [
    "dep:headers",
    "dep:regex",
    "dep:language-tags",
    "dep:percent-encoding",
    "dep:http",
]
# adapter group
reqwest = ["dep:reqwest", "http"]
ureq2 = ["dep:ureq2", "http"]
ureq3 = ["dep:ureq3", "http"]
serde = ["dep:serde"]

# runtime group
tokio = ["dep:tokio"]
smol = ["dep:smol"]

tracing = ["dep:tracing"]

[lib]
name = "bolt_load"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
async-trait = "0.1"
futures = { version = "0.3" } 
futures-concurrency = "7"
pin-project-lite = "0.2"
url = "2"
bytes = "1"
enum_dispatch = "0.3"
atomic_enum = "0.3"
tempfile = "3"
smol-cancellation-token = "0.1"
derive_more = { version = "2", features = ["debug"] }
statig = { version = "0.4.1", features = ["async"] }
bitvec = "1"                                           # for task id generation
memmap2 = "0.9"                                        # for better random range write for files if machine is available
backon = "1"                                           # for retry strategy
oneshot = { version = "0.1", features = ["async"] }    # for cross runtime oneshot
async-waitgroup = "0.1.3"                              # for cross runtime wait group
async-lock = "3"                                       # for cross runtime async lock
ranges = "0.4"                                         # for range set operation
async-channel = "2"                                    # for async channel
async-broadcast = { version = "0.7" }
async-fs = "2"                                         # for async file operation
async-io = "2"                                         # for async timer
blocking = "1"                                         # convert blocking io to async

serde = { version = "1", features = ["derive"], optional = true }

# for http content-disposition parsing
http = { version = "1", optional = true }
regex = { version = "1", optional = true }
language-tags = { version = "0.3", optional = true }
percent-encoding = { version = "2.3", optional = true }
# for http headers
headers = { version = "0.4", optional = true }
# for reqwest adapter
reqwest = { version = "0.12", optional = true, features = ["stream"] }
# for ureq adapter
ureq2 = { version = "2", package = "ureq", optional = true }
ureq3 = { version = "3", package = "ureq", optional = true }

# runtime group
tokio = { version = "1", features = ["rt", "rt-multi-thread", "tracing"], optional = true }
smol = { version = "2", optional = true }

# tracing
tracing = { version = "0.1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tracing-test = { git = "https://github.com/Frando/tracing-test.git", rev = "e81ec65", features = ["pretty-log-printing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"

# for stream test
async-stream = "0.3"

# for generate a random file
rand = "0.9"

# for hash verification in tests
blake3 = "1"

# for http server test
axum = "0.8.4"
axum-extra = { version = "0.10", features = ["typed-header"] }
axum-range = "0.5"

# Tracing and bench
portpicker = "0.1"
tracing-tracy = "0.11"
console-subscriber = "0.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { version = "0.31", features = [
    "metrics",
] }
opentelemetry = { version = "0.30", features = [
    "trace",
    "metrics",
] }
opentelemetry_sdk = { version = "0.30", features = [
    "trace",
    "rt-tokio",
] }
opentelemetry-otlp = { version = "0.30", features = [
    "metrics",
    "grpc-tonic",
] }
opentelemetry-semantic-conventions = { version = "0.30", features = [
    "semconv_experimental",
] }
opentelemetry-stdout = { version = "0.30", features = [
    "trace",
    "metrics",
] }
