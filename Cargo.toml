[workspace]
members = [
    'crates/bolt-load',
    "crates/bolt-load-core",
    'crates/bolt-load-adapter',
    'crates/bolt-load-tests',
    "crates/bolt-load-utils",
    "crates/bolt-load-sync",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greenhat616/bolt-load"
homepage = "https://github.com/greenhat616/bolt-load"
keywords = ["download", "async", "http", "parallel", "loader"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
futures = "0.3"
bytes = "1"
snafu = "0.9"

async-lock = "3"
blocking = "1"

tracing = "0.1"

# Dev Dependencies
anyhow = "1"
tokio = "1"
tokio-util = "0.7"
pretty_assertions = "1"
n0-tracing-test = { version = "0.3.0", features = ["pretty-log-printing"] }


# loom 0.7.2 lets an RMW read a value older than the latest store
# (tokio-rs/loom#254), which fails the `bolt-load-sync` slot models
# spuriously. Pinned to the unmerged fix (tokio-rs/loom#391) until a release
# carries it; loom only builds under `--cfg loom`, and `[patch]` is not
# published.
[patch.crates-io]
loom = { git = "https://github.com/ZobyTwo/loom", rev = "c673a8d" }
